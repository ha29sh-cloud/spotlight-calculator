<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مخطط توزيع السبوت لايت</title>
  <style>
    body {
      font-family: Tahoma, sans-serif;
      direction: rtl;
      margin: 20px;
      background-color: #21293b;
      color: orange;
      text-align: center;
    }
    label { display: block; margin: 8px 0 4px; }
    input, select {
      padding: 8px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 10px;
      border: 1px solid orange;
      border-radius: 4px;
      background: #21293b;
      color: orange;
    }
    button {
      padding: 10px 20px;
      background: orange;
      color: #21293b;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      margin: 5px;
      font-weight: bold;
    }
    button:hover { background: #ffb84d; }
    #room {
      margin: 20px auto;
      border: 2px solid orange;
      position: relative;
      background: #1a2233;
    }
    .spot {
      width: 20px;
      height: 20px;
      background: orange;
      border-radius: 50%;
      position: absolute;
      transform: translate(-50%, -50%);
    }
    #result { margin-top: 20px; font-weight: bold; }
    img.logo {
      max-width: 150px;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <!-- صورة الشعار -->
  <img src="https://via.placeholder.com/150x80.png?text=Logo" alt="شعار" class="logo">

  <h1>حاسبة ومخطط السبوت لايت</h1>

  <label>العرض (متر)</label>
  <input id="width" type="number" step="0.1">

  <label>الطول (متر)</label>
  <input id="length" type="number" step="0.1">

  <label>الارتفاع (متر)</label>
  <input id="height" type="number" step="0.1">

  <label>اختر نوع المكان</label>
  <select id="roomType">
    <option value="150">غرفة نوم</option>
    <option value="200">صالة/غرفة معيشة</option>
    <option value="300">مكتب/مطبخ</option>
    <option value="500">حمام/منطقة عمل دقيقة</option>
  </select>

  <div>
    <button onclick="calc()">احسب ووزع</button>
    <button onclick="downloadPlan()">تنزيل المخطط</button>
    <button onclick="window.print()">طباعة</button>
  </div>

  <div id="result"></div>
  <div id="room"></div>

  <script>
    function calc() {
      let width = parseFloat(document.getElementById('width').value);
      let length = parseFloat(document.getElementById('length').value);
      let height = parseFloat(document.getElementById('height').value);
      let lux = parseFloat(document.getElementById('roomType').value);

      let lumensPerSpot = 800; // نفترض أن كل سبوت يعطي 800 لومن

      if (width > 0 && length > 0 && height > 0) {
        let area = width * length;
        let needed = area * lux;
        let spots = Math.ceil(needed / lumensPerSpot);

        document.getElementById('result').innerText =
          "عدد السبوت المقترح: " + spots;

        // رسم الغرفة بنسبة أبعادها
        let scale = 40; // 1 متر = 40 بكسل
        let room = document.getElementById('room');
        room.style.width = (width * scale) + "px";
        room.style.height = (length * scale) + "px";
        room.innerHTML = "";

        // توزيع السبوتات بشكل شبكة منتظمة
        let cols = Math.ceil(Math.sqrt(spots * (width / length)));
        let rows = Math.ceil(spots / cols);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let index = r * cols + c;
            if (index < spots) {
              let x = (c + 0.5) * (room.clientWidth / cols);
              let y = (r + 0.5) * (room.clientHeight / rows);
              let div = document.createElement('div');
              div.className = "spot";
              div.style.left = x + "px";
              div.style.top = y + "px";
              room.appendChild(div);
            }
          }
        }
      } else {
        document.getElementById('result').innerText =
          "يرجى إدخال قيم صحيحة.";
      }
    }

    // تنزيل المخطط كصورة
    function downloadPlan() {
      html2canvas(document.getElementById("room")).then(canvas => {
        let link = document.createElement("a");
        link.download = "spotlight-plan.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    }
  </script>

  <!-- مكتبة html2canvas لتحويل المخطط لصورة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
