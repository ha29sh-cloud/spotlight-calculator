<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مخطط توزيع السبوت لايت</title>
  <style>
    body { font-family: Tahoma, sans-serif; direction: rtl; margin: 20px; background:#21293b; color: orange; }
    h1 { text-align: center; }
    label { display: block; margin: 8px 0 4px; }
    input, select { padding: 8px; width: 100%; max-width: 320px; margin-bottom: 10px; border:1px solid orange; border-radius:6px; background:#21293b; color: orange; }
    .btn { padding:10px 16px; background:orange; color:#21293b; border:none; border-radius:6px; cursor:pointer; font-weight:bold; margin:5px; }
    .btn:hover { background:#ffb84d; }
    #room { margin:20px auto; border:2px solid orange; position:relative; background:#fff; }
    .spot { width:18px; height:18px; background:orange; border-radius:50%; position:absolute; transform:translate(-50%, -50%); }
    .dimension { position:absolute; font-size:14px; color:white; font-weight:bold; }
    .arrow { position:absolute; background:black; }
    .arrow::after { content:""; position:absolute; border:6px solid transparent; }
    .arrow.vertical::after { border-top-color:black; top:100%; left:-5px; }
    .arrow.horizontal::after { border-left-color:black; left:100%; top:-5px; }
    #result { margin-top: 16px; background:#1a2233; padding:12px; border-radius:6px; }
    #summary { margin-top: 16px; background:#1a2233; padding:12px; border-radius:6px; font-weight:bold; line-height:1.8; }
    #summary h3 { margin:8px 0; color:#ffb84d; }
    #summary ul { margin:0; padding:0 20px; }
    #summary li { margin-bottom:6px; }
  </style>
</head>
<body>
  <h1>حاسبة ومخطط السبوت لايت</h1>

  <label>العرض (متر)</label>
  <input id="width" type="number" step="0.1">

  <label>الطول (متر)</label>
  <input id="length" type="number" step="0.1">

  <label>الارتفاع (متر)</label>
  <input id="height" type="number" step="0.1">

  <label>اختر نوع المكان</label>
  <select id="roomType">
    <option value="150">غرفة نوم</option>
    <option value="200">صالة/غرفة معيشة</option>
    <option value="300">مكتب/مطبخ</option>
    <option value="500">حمام/منطقة عمل دقيقة</option>
  </select>

  <div>
    <button class="btn" onclick="calc()">احسب ووزّع</button>
    <button class="btn" onclick="downloadPlan()">حفظ المخطط كصورة</button>
    <button class="btn" onclick="window.print()">طباعة</button>
    <button class="btn" onclick="sharePlan()">مشاركة الخطة</button>
    <button class="btn" onclick="resetPlan()">مسح وإعادة البدء</button>
  </div>

  <div id="result"></div>
  <div id="room"></div>
  <div id="summary"></div>

  <script>
    function calc() {
      let width = parseFloat(document.getElementById('width').value);
      let length = parseFloat(document.getElementById('length').value);
      let height = parseFloat(document.getElementById('height').value);
      let lux = parseFloat(document.getElementById('roomType').value);

      let lumensPerSpot = 800; // نفترض أن كل سبوت يعطي 800 لومن

      if (width > 0 && length > 0 && height > 0) {
        let area = width * length;
        let needed = area * lux;
        let spots = Math.ceil(needed / lumensPerSpot);

        document.getElementById('result').innerText =
          "عدد السبوت المقترح: " + spots;

        // رسم الغرفة بنسبة أبعادها
        let scale = 40; // 1 متر = 40 بكسل
        let room = document.getElementById('room');
        room.style.width = (width * scale) + "px";
        room.style.height = (length * scale) + "px";
        room.innerHTML = "";

        // توزيع السبوتات بشكل شبكة منتظمة
        let cols = Math.ceil(Math.sqrt(spots * (width / length)));
        let rows = Math.ceil(spots / cols);

        let spacingX = (width / cols).toFixed(2);
        let spacingY = (length / rows).toFixed(2);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            let index = r * cols + c;
            if (index < spots) {
              let x = (c + 0.5) * (room.clientWidth / cols);
              let y = (r + 0.5) * (room.clientHeight / rows);
              let div = document.createElement('div');
              div.className = "spot";
              div.style.left = x + "px";
              div.style.top = y + "px";
              room.appendChild(div);
            }
          }
        }

        // أسهم سوداء من الجدران
        let arrowLeft = document.createElement('div');
        arrowLeft.className = "arrow horizontal";
        arrowLeft.style.height = "2px";
        arrowLeft.style.width = (room.clientWidth/cols/2) + "px";
        arrowLeft.style.top = (room.clientHeight/2) + "px";
        arrowLeft.style.left = "0px";
        room.appendChild(arrowLeft);

        let arrowTop = document.createElement('div');
        arrowTop.className = "arrow vertical";
        arrowTop.style.width = "2px";
        arrowTop.style.height = (room.clientHeight/rows/2) + "px";
        arrowTop.style.left = (room.clientWidth/2) + "px";
        arrowTop.style.top = "0px";
        room.appendChild(arrowTop);

        // كتابة الأبعاد على الجوانب
        let dimWidth = document.createElement('div');
        dimWidth.className = "dimension";
        dimWidth.style.top = (room.clientHeight + 5) + "px";
        dimWidth.style.left = (room.clientWidth/2 - 20) + "px";
        dimWidth.innerText = width + " م";
        room.appendChild(dimWidth);

        let dimLength = document.createElement('div');
        dimLength.className = "dimension";
        dimLength.style.left = (room.clientWidth + 5) + "px";
        dimLength.style.top = (room.clientHeight/2 - 10) + "px";
        dimLength.innerText = length + " م";
        room.appendChild(dimLength);

        // ملخص الخطة مرتب ومقسم
        document.getElementById('summary').innerHTML =
          "<h3>📐 أبعاد الغرفة</h3><ul>" +
          "<li>المساحة: " + area.toFixed(2) + " م²</li>" +
          "<li>الأبعاد: " + width + " م × " + length + " م</li></ul>" +

          "<h3>💡 الإضاءة</h3><ul>" +
          "<li>عدد النقاط: " + spots + " سبوت</li>" +
          "<li>المساحة النقطية: " + (area/spots).toFixed(2) + " م² لكل سبوت</li></ul>" +

          "<h3>📏 تفاصيل المسافات</h3><ul>" +
          "<li>من الجدران: 1 × 1 متر (موضحة بالأسهم السوداء)</li>" +
          "<li>بين المصابيح: " + spacingX + " × " + spacingY + " متر (تقريبًا)</li>" +
          "<li>نمط التوزيع: شبكة منتظمة</li></ul>";
      } else {
        document.getElementById('result').innerText =
          "يرجى إدخال قيم صحيحة.";
        document.getElementById('summary').innerText = "";
      }
    }

      html2canvas(document.getElementById("room")).then(canvas => {
        let link
