<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>حاسبة السبوت لايت</title>

<style>
    body { font-family: Tahoma, sans-serif; background:#21293b; padding:20px; }
    .container { max-width: 1200px; margin:auto; display:flex; gap:20px; flex-wrap:wrap; }
    .box { background:#fff; padding:20px; border-radius:10px; flex:1 1 340px; box-shadow:0 0 10px rgba(0,0,0,0.05); }
    h1 { margin-top:0; margin-bottom:20px; text-align: center; color:#FF8C00; }
    h2 { margin-top:0; color:#21293b;}
    label { font-size:14px; }
    input, select { width:100%; padding:8px; margin:5px 0 12px; border-radius:6px; border:1px solid #ccc; box-sizing:border-box; }
    button { padding:10px 14px; background:#FF8C00; color:#21293b; border:none; border-radius:6px; cursor:pointer; font-size:14px; }
    button:hover { background:#005fcc; }
    .btn-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .btn-row button { flex:1 1 120px; }
    .result { margin-top:15px; padding:10px; background:#e9f4ff; border-radius:8px; font-size:14px; line-height:1.7; }
    canvas { background:#fff; border:1px solid #ccc; border-radius:8px; }
    .note { font-size:12px; color:#666; margin-top:8px; }
    .coords { font-size:13px; margin-top:10px; max-height:200px; overflow:auto; direction:ltr; text-align:left; background:#fafafa; padding:8px; border-radius:6px; border:1px solid #eee; }
    .warning { color:#c0392b; font-weight:bold; margin-top:8px; font-size:13px; }
    @media (max-width: 600px) {
    canvas {
        width: 100% !important;
        height: auto !important;
    }
    .box {
        flex: 1 1 100% !important;
    }
    body {
        padding: 10px;
    }
}
    @media print {
        body { background:#fff; }
        .no-print { display:none !important; }
        .container { max-width:100%; }
    }
</style>
</head>

<body>
<div style="text-align:center; margin-bottom:20px;">
    <img src="https://raw.githubusercontent.com/ha29sh-cloud/spotlight-calculator/main/logo.png"
         alt="Logo"
         style="width:150px;">
</div>
<h1>حساب وتوزيع السبوت لايت </h1>

<div class="container">

    <!-- الصندوق الأول -->
    <div class="box">
        <h2>بيانات الغرفة والإضاءة</h2>

        <label>طول الغرفة بالـ(متر)</label>
        <input type="number" id="length" step="0.1">

        <label>عرض الغرفة بالـ(متر)</label>
        <input type="number" id="width" step="0.1">

        <label>ارتفاع السقف "اختياري"</label>
        <input type="number" id="height" step="0.1">

        <label>نوع الغرفة</label>
        <select id="roomType" onchange="suggestLumen()">
            <option value="200">صالة (200 لوكس)</option>
            <option value="120">غرفة نوم (120 لوكس)</option>
            <option value="350">مطبخ (350 لوكس)</option>
            <option value="150">ممرات (150 لوكس)</option>
            <option value="250">حمّام (250 لوكس)</option>
        </select>

        <label>لومن الكشاف الواحد</label>
        <input type="number" id="spotLumen" oninput="checkLumen()">

        <div id="suggestBox" style="font-size:13px; color:#0078ff; margin-top:-8px; margin-bottom:10px;"></div>
        <button class="no-print" onclick="applySuggestedLumen()">استخدم اللومن المقترح</button>

       <label style="display:block; margin-top:15px;">زاوية شعاع الكشاف (اختياري)</label>
       <input type="number" id="beamAngle">

        <label>مسافة من الجدار لأول سبوت بالـ(متر)</label>
        <input type="number" id="margin" value="0.5" step="0.1">

        <label>نوع التوزيع</label>
        <select id="distributionType">
            <option value="grid">توزيع شبكي</option>
            <option value="linearLength">خط طولي</option>
            <option value="linearWidth">خط عرضي</option>
            <option value="perimeter">محيطي</option>
            <option value="Ushape">شكل U</option>
        </select>

        <label>شكل السبوت</label>
        <select id="spotShape">
            <option value="circle">دائري</option>
            <option value="square">مربع</option>
        </select>

        <button class="no-print" onclick="calculate()">احسب ووزّع</button>

        <div id="output" class="result" style="display:none;"></div>
        <div id="warning" class="warning" style="display:none;"></div>

        <div class="btn-row no-print">
            <button onclick="printPage()">طباعة</button>
            <button onclick="downloadCoords()">تحميل الإحداثيات</button>
        </div>
    </div>

    <!-- الصندوق الثاني -->
    <div class="box">
        <h2>مخطط الغرفة</h2>
	<label class="no-print" style="display:block; margin-bottom:10px;">
        <input type="checkbox" id="toggleBeam" checked onchange="drawPlan(lastLength, lastWidth, lastSpots, document.getElementById('spotShape').value)">
        إظهار تغطية زاوية الإشعاع
        </label>
        <canvas id="planCanvas" width="500" height="400"></canvas>
        <div class="note">الدوائر تمثل أماكن السبوتات</div>
        <div id="coords" class="coords" style="display:none;"></div>
    </div>

</div>

<script>
let lastSpots = [];
let lastLength = 0;
let lastWidth = 0;
window.onload = function () {
    suggestLumen(); // يضبط اللومن المقترح حسب النوع الافتراضي (صالة)
};

/* ---------------------------
   1) اقتراح لومن حسب نوع الغرفة
----------------------------*/
function suggestLumen() {
    let type = document.getElementById("roomType").value;
    let suggestBox = document.getElementById("suggestBox");

    let suggested = 500; // default

    if (type == 200) suggested = 850;      // صالة
    if (type == 120) suggested = 550;      // نوم
    if (type == 350) suggested = 1100;     // مطبخ
    if (type == 150) suggested = 400;      // ممرات
    if (type == 250) suggested = 550;      // حمّام

    suggestBox.innerHTML = "اللومن المقترح: " + suggested + " لومن";
    suggestBox.dataset.value = suggested;
}

function applySuggestedLumen() {
    let suggestBox = document.getElementById("suggestBox");
    let v = suggestBox.dataset.value;

    // لو ما فيه قيمة محفوظة، نحسبها الآن
    if (!v) {
        suggestLumen();
        v = suggestBox.dataset.value;
    }

    if (v) {
        document.getElementById("spotLumen").value = v;
        checkLumen(); // علشان يظهر التحذير أو يختفي حسب القيمة
    }
}

/* ---------------------------
   2) التحقق من الحد الأدنى للّومن
----------------------------*/
function checkLumen() {
    let val = parseFloat(document.getElementById("spotLumen").value);
    let warn = document.getElementById("warning");

    if (val < 80) {
        warn.style.display = "block";
        warn.textContent = "أقل لومن عملي للسبوت هو 80 لومن";
    } else if (val < 150) {
        warn.style.display = "block";
        warn.textContent = "اللومن منخفض جدًا وقد يعطي إضاءة ضعيفة";
    } else {
        warn.style.display = "none";
    }
}
/* ---------------------------
   3) الحسابات الرئيسية
----------------------------*/
function calculate() {
    let length = parseFloat(document.getElementById("length").value);
    let width = parseFloat(document.getElementById("width").value);
    let height = parseFloat(document.getElementById("height").value) || null;
    let lux = parseFloat(document.getElementById("roomType").value);
    let spotLumen = parseFloat(document.getElementById("spotLumen").value);
    let marginInput = parseFloat(document.getElementById("margin").value);
    let distributionType = document.getElementById("distributionType").value;
    let spotShape = document.getElementById("spotShape").value;
    let beamAngle = parseFloat(document.getElementById("beamAngle").value) || null;

    if (!length || !width || !spotLumen) {
        alert("الرجاء تعبئة الطول والعرض ولومن الكشاف");
        return;
    }

    // ضبط المارجن
    let minSide = Math.min(length, width);
    let margin = marginInput || 0.5;
    if (2 * margin >= minSide * 0.6) {
        margin = +(minSide * 0.2).toFixed(2);
    }

    // حسابات الإضاءة
    let area = length * width;
    let totalLumen = area * lux;
    let spotCount = Math.ceil(totalLumen / spotLumen);
    if (spotCount < 1) spotCount = 1;

    // تحذير لو العدد كبير
    let warn = document.getElementById("warning");
    if (spotCount > 40) {
        warn.style.display = "block";
        warn.textContent = "عدد السبوتات كبير جدًا، يفضّل استخدام لومن أعلى.";
    } else {
        warn.style.display = "none";
    }

    // توزيع السبوتات
    let spots = [];

    if (distributionType === "grid") {
        let aspect = length / width;
        let cols = Math.round(Math.sqrt(spotCount * aspect));
        if (cols < 1) cols = 1;
        let rows = Math.ceil(spotCount / cols);

        if (rows > cols * 2) {
            rows = Math.round(Math.sqrt(spotCount / aspect));
            if (rows < 1) rows = 1;
            cols = Math.ceil(spotCount / rows);
        }

        let effectiveLength = Math.max(length - 2 * margin, length * 0.4);
        let effectiveWidth = Math.max(width - 2 * margin, width * 0.4);

        let spacingX = (cols > 1) ? effectiveLength / (cols - 1) : 0;
        let spacingY = (rows > 1) ? effectiveWidth / (rows - 1) : 0;

        let startX = (cols > 1) ? margin : length / 2;
        let startY = (rows > 1) ? margin : width / 2;

        let count = 0;
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                if (count >= spotCount) break;
                let x = startX + c * spacingX;
                let y = startY + r * spacingY;
                spots.push({ x, y });
                count++;
            }
        }

        buildOutput(area, lux, totalLumen, spotLumen, spotCount, rows, cols, spacingX, spacingY, margin, height, beamAngle);

    } else if (distributionType === "linearLength") {
        let cols = spotCount;
        let rows = 1;

        let effectiveLength = Math.max(length - 2 * margin, length * 0.4);
        let spacingX = (cols > 1) ? effectiveLength / (cols - 1) : 0;
        let startX = (cols > 1) ? margin : length / 2;
        let y = width / 2;

        for (let c = 0; c < cols; c++) {
            let x = startX + c * spacingX;
            spots.push({ x, y });
        }

        buildOutput(area, lux, totalLumen, spotLumen, spotCount, rows, cols, spacingX, 0, margin, height, beamAngle, "توزيع خطي طولي");

    } else if (distributionType === "linearWidth") {
        let rows = spotCount;
        let cols = 1;

        let effectiveWidth = Math.max(width - 2 * margin, width * 0.4);
        let spacingY = (rows > 1) ? effectiveWidth / (rows - 1) : 0;
        let startY = (rows > 1) ? margin : width / 2;
        let x = length / 2;

        for (let r = 0; r < rows; r++) {
            let y = startY + r * spacingY;
            spots.push({ x, y });
        }

        buildOutput(area, lux, totalLumen, spotLumen, spotCount, rows, cols, 0, spacingY, margin, height, beamAngle, "توزيع خطي عرضي");

    } else if (distributionType === "perimeter") {
        let perimeter = 2 * (length + width);
        let spacing = perimeter / spotCount;

        let curr = 0;
        for (let i = 0; i < spotCount; i++) {
            let d = curr % perimeter;
            let x, y;

            if (d <= length) {
                x = d;
                y = margin;
            } else if (d <= length + width) {
                x = length - margin;
                y = d - length;
            } else if (d <= 2 * length + width) {
                x = length - (d - (length + width));
                y = width - margin;
            } else {
                x = margin;
                y = width - (d - (2 * length + width));
            }

            curr += spacing;
            spots.push({ x, y });
        }

        buildOutput(area, lux, totalLumen, spotLumen, spotCount, null, null, null, null, margin, height, beamAngle, "توزيع محيطي");

    } else if (distributionType === "Ushape") {
        let side = Math.floor(spotCount / 3);
        let rem = spotCount - side * 3;

        let top = side + (rem > 0 ? 1 : 0);
        let right = side + (rem > 1 ? 1 : 0);
        let bottom = side;

        // علوي
        let effL = Math.max(length - 2 * margin, length * 0.4);
        let spacingTop = (top > 1) ? effL / (top - 1) : 0;
        let startXTop = (top > 1) ? margin : length / 2;

        for (let i = 0; i < top; i++) {
            spots.push({ x: startXTop + i * spacingTop, y: margin });
        }

        // يمين
        let effW = Math.max(width - 2 * margin, width * 0.4);
        let spacingRight = (right > 1) ? effW / (right - 1) : 0;
        let startYRight = (right > 1) ? margin : width / 2;

        for (let i = 0; i < right; i++) {
            spots.push({ x: length - margin, y: startYRight + i * spacingRight });
        }

        // سفلي
        let spacingBottom = (bottom > 1) ? effL / (bottom - 1) : 0;
        let startXBottom = (bottom > 1) ? margin : length / 2;

        for (let i = 0; i < bottom; i++) {
            spots.push({ x: startXBottom + i * spacingBottom, y: width - margin });
        }

        buildOutput(area, lux, totalLumen, spotLumen, spotCount, null, null, null, null, margin, height, beamAngle, "توزيع U");
    }

    // عرض الإحداثيات
    let coordsDiv = document.getElementById("coords");
    let html = "<strong>إحداثيات السبوتات:</strong><br><br>";
    spots.forEach((s, i) => {
        html += `Spot ${i+1}: X=${s.x.toFixed(2)}m , Y=${s.y.toFixed(2)}m<br>`;
    });
    coordsDiv.innerHTML = html;
    coordsDiv.style.display = "block";

    lastSpots = spots;
    lastLength = length;
    lastWidth = width;

    drawPlan(length, width, spots, spotShape);
}

/* ---------------------------
   4) إخراج النتائج
----------------------------*/
function buildOutput(area, lux, totalLumen, spotLumen, spotCount, rows, cols, spacingX, spacingY, margin, height, beamAngle, extra) {
    let out = document.getElementById("output");

    let beamText = "";
    if (height && beamAngle) {
        let rad = beamAngle * Math.PI / 180;
        let radius = height * Math.tan(rad / 2);
        let diameter = radius * 2;
        beamText = `قطر تغطية الضوء على الأرض: ${diameter.toFixed(2)} م<br>`;
    }

    let layout = "";
    if (rows && cols) {
        layout = `
        الصفوف: ${rows}<br>
        الأعمدة: ${cols}<br>
        مسافة الطول: ${spacingX.toFixed(2)} م<br>
        مسافة العرض: ${spacingY.toFixed(2)} م<br>`;
    } else if (extra) {
        layout = `نوع التوزيع: ${extra}<br>`;
    }

    out.innerHTML = `
        <strong>نتيجة الحسبة:</strong><br><br>
        مساحة الغرفة: ${area.toFixed(2)} م²<br>
        اللوكس: ${lux}<br>
        إجمالي اللومن المطلوب: ${totalLumen.toFixed(0)}<br>
        لومن الكشاف: ${spotLumen}<br>
        <strong>عدد السبوتات: ${spotCount}</strong><br><br>
        ${layout}
        المسافة من الجدار: ${margin} م<br><br>
        ${beamText}
    `;
    out.style.display = "block";
}

/* ---------------------------
   5) رسم المخطط
----------------------------*/
function drawPlan(length, width, spots, shape) {
    let canvas = document.getElementById("planCanvas");
    let ctx = canvas.getContext("2d");

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let marginPx = 50;
    let usableW = canvas.width - marginPx * 2;
    let usableH = canvas.height - marginPx * 2;

    let scaleX = usableW / length;
    let scaleY = usableH / width;
    let scale = Math.min(scaleX, scaleY);

    let roomW = length * scale;
    let roomH = width * scale;

    let offsetX = (canvas.width - roomW) / 2;
    let offsetY = (canvas.height - roomH) / 2;

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 2;
    ctx.strokeRect(offsetX, offsetY, roomW, roomH);

    drawNorthArrow(ctx, canvas.width - 70, offsetY + 20);

    // هل المستخدم يريد إظهار زاوية الإشعاع؟
    let showBeam = document.getElementById("toggleBeam")?.checked;

    // حساب قطر التغطية
    let height = parseFloat(document.getElementById("height").value);
    let beamAngle = parseFloat(document.getElementById("beamAngle").value);

    let beamRadiusPx = null;

    if (showBeam && height && beamAngle) {
        let rad = beamAngle * Math.PI / 180;
        let radius = height * Math.tan(rad / 2); // بالمتر
        beamRadiusPx = radius * scale; // تحويل إلى بكسل
    }

    // رسم السبوتات
    spots.forEach(s => {
        let px = offsetX + s.x * scale;
        let py = offsetY + s.y * scale;

        // دائرة التغطية
        if (beamRadiusPx) {
            ctx.beginPath();
            ctx.strokeStyle = "rgba(255,165,0,0.5)";
            ctx.lineWidth = 1.2;
            ctx.arc(px, py, beamRadiusPx, 0, Math.PI * 2);
            ctx.stroke();
        }

        // توهج
        let glow = ctx.createRadialGradient(px, py, 2, px, py, 18);
        glow.addColorStop(0, "rgba(0,120,255,0.5)");
        glow.addColorStop(1, "rgba(0,120,255,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(px, py, 18, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#0078ff";
        ctx.strokeStyle = "#0050aa";

        if (shape === "square") {
            ctx.beginPath();
            ctx.rect(px - 5, py - 5, 10, 10);
            ctx.fill();
            ctx.stroke();
        } else {
            ctx.beginPath();
            ctx.arc(px, py, 5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
        }
    });
}

function drawNorthArrow(ctx, x, y) {
    ctx.save();
    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1.5;

    ctx.beginPath();
    ctx.moveTo(x, y + 15);
    ctx.lineTo(x, y - 10);
    ctx.lineTo(x - 5, y - 3);
    ctx.moveTo(x, y - 10);
    ctx.lineTo(x + 5, y - 3);
    ctx.stroke();

    ctx.font = "11px Tahoma";
    ctx.fillText("شمال", x, y + 28);

    ctx.restore();
}

/* ---------------------------
   6) الطباعة والتحميل
----------------------------*/
function printPage() {
    window.print();
}

function downloadCoords() {
    if (!lastSpots.length) {
        alert("لا توجد بيانات");
        return;
    }

    let lines = ["إحداثيات السبوتات:\n"];
    lastSpots.forEach((s, i) => {
        lines.push(`Spot ${i+1}: X=${s.x.toFixed(2)} , Y=${s.y.toFixed(2)}`);
    });

    let blob = new Blob([lines.join("\n")], { type: "text/plain" });
    let url = URL.createObjectURL(blob);

    let a = document.createElement("a");
    a.href = url;
    a.download = "spot_coords.txt";
    a.click();

    URL.revokeObjectURL(url);
}
</script>

</body>
</html>
