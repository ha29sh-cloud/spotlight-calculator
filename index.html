<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>مخطط توزيع السبوت لايت</title>
  <style>
    :root {
      --lamp-color: #ff8c00;
      --lamp-border: #000;
      --bg-dark: #21293b;
      --bg-section: #1a2233;
    }
 .watermark-img {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      opacity: 0.15; /* شفافية */
      width: 200px;
      pointer-events: none;
      z-index: 999;
    }
    body {
      font-family: Tahoma, sans-serif;
      direction: rtl;
      margin: 20px;
      background: var(--bg-dark);
      color: #ff8c00;
      text-align:center;
      font-size: 16px;
      line-height: 1.6;
    }
    h1 { font-size: 22px; }
    .form-section {
      display:inline-block;
      text-align:right;
      background: var(--bg-section);
      padding:20px;
      border-radius:10px;
      max-width: 95%;
    }
    label { display:block; margin:8px 0 4px; font-size:16px; }
    input, select {
      padding:12px;
      width:100%;
      margin-bottom:12px;
      border:1px solid #ff8c00;
      border-radius:6px;
      background: var(--bg-dark);
      color: #ff8c00;
      font-size:16px;
      min-height:44px;
    }
    .btn {
      padding:12px 20px;
      background:#ff8c00;
      color: var(--bg-dark);
      border:none;
      border-radius:6px;
      cursor:pointer;
      font-weight:bold;
      margin:6px;
      font-size:16px;
      min-width:120px;
    }
    .btn:hover { background:#ffa733; }
    #planWrapper { background:#fff; padding:15px; border-radius:8px; display:inline-block; margin-top:20px; }
    #room { margin:30px auto; border:2px solid #000; position:relative; background:#fff; }
    .spot {
      width:16px; height:16px;
      background: var(--lamp-color);
      border:2px solid var(--lamp-border);
      border-radius:50%;
      position:absolute;
      transform:translate(-50%, -50%);
    }
    .dimension { position:absolute; font-size:14px; color:#000; font-weight:bold; }
    .arrow-line { position:absolute; background:#000; }
    .arrow-head { width:0; height:0; position:absolute; border:8px solid transparent; }
    .head-right { border-left-color:#000; }
    .head-down  { border-top-color:#000; }
    .arrow-label {
      position:absolute;
      background:#000;
      color:#fff;
      padding:2px 6px;
      border-radius:4px;
      font-size:12px;
      transform:translate(-50%, -50%);
      white-space:nowrap;
    }
    #result {
      margin-top:16px;
      background: var(--bg-section);
      padding:12px;
      border-radius:6px;
      color:#fff;
      font-size:18px;
      font-weight:bold;
    }
    #summary {
      margin-top:16px;
      background: var(--bg-section);
      padding:20px;
      border-radius:6px;
      font-weight:bold;
      line-height:1.8;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:20px;
      text-align:right;
    }
@media (max-width:600px) {
  #room {
    transform: scale(0.8); /* تصغير المخطط */
    transform-origin: top left;
  }
}

    #summary div { border-radius:8px; padding:10px; }
    #summary div:nth-child(1) { background:#2a2f45; }
    #summary div:nth-child(2) { background:#33384d; }
    #summary div:nth-child(3) { background:#3a4055; }
    #summary h3 {
      margin:8px 0;
      color:#ff8c00;
      text-align:center;
      font-size:18px;
    }
    #summary p { margin:6px 0; color:#ff8c00; font-size:15px; }
    .after-summary { margin-top:15px; }
    @media (max-width:767px) {
      input, select { font-size:15px; }
      .btn { font-size:15px; min-width:100px; }
    }
  </style>
</head>
<body>
  <h1>حاسبة ومخطط السبوت لايت</h1>

  <div class="form-section">
    <label>الطول (متر)</label>
    <input id="length" type="number" step="0.1" placeholder="مثال: 8">
    <label>العرض (متر)</label>
    <input id="width" type="number" step="0.1" placeholder="مثال: 6">
    <label>الارتفاع (متر)</label>
    <input id="height" type="number" step="0.1" placeholder="مثال: 3">
    <label>اختر نوع المكان</label>
    <select id="roomType">
      <option value="150">غرفة نوم (150 لوكس)</option>
      <option value="200">صالة/غرفة معيشة (200 لوكس)</option>
      <option value="300">مكتب/مطبخ (300 لوكس)</option>
      <option value="500">حمام/منطقة عمل دقيقة (500 لوكس)</option>
    </select>
    <div>
      <button class="btn" onclick="calc()">احسب ووزّع</button>
      <button class="btn" onclick="resetPlan()">مسح وإعادة البدء</button>
    </div>
  </div>

  <div id="result"></div>
  <div id="planWrapper">
    <div id="roomWrapper"><div id="room"></div></div>
    <div id="summary"></div>
  </div>
  <div class="after-summary">
    <button class="btn" onclick="downloadPlan()">حفظ المخطط مع الملخص كصورة</button>
    <button class="btn" onclick="sharePlan()">مشاركة المخطط</button>
    <button class="btn" onclick="window.print()">طباعة</button>
  </div>

  <script>
    const SCALE = 60; // تكبير المخطط
    const SPOT_DIAMETER = 20;
    const SPOT_RADIUS = SPOT_DIAMETER / 2;

    function calc() {
      const width = parseFloat(document.getElementById('width').value);
      const length = parseFloat(document.getElementById('length').value);
      const height = parseFloat(document.getElementById('height').value);
      const lux = parseFloat(document.getElementById('roomType').value);
      const lumensPerSpot = 800;

      if (!(width > 0 && length > 0 && height > 0)) {
        document.getElementById('result').innerText = "يرجى إدخال قيم صحيحة.";
        return;
      }

      const area = width * length;
      const needed = area * lux;
      const spots = Math.max(1, Math.ceil(needed / lumensPerSpot));
      document.getElementById('result').innerText = "عدد السبوت المقترح: " + spots;

      const room = document.getElementById('room');
      room.style.width = (width * SCALE) + "px";
      room.style.height = (length * SCALE) + "px";
      room.innerHTML = "";

      let cols = Math.ceil(Math.sqrt(spots * (width / length)));
      let rows = Math.ceil(spots / cols);
      while (cols * rows < spots) { if (width/cols > length/rows) cols++; else rows++; }

      const spacingX = width / cols;
      const spacingY = length / rows;
      const lampPositions = [];

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const index = r * cols + c;
          if (index < spots) {
            const x = (c + 0.5) * (room.clientWidth / cols);
            const y = (r + 0.5) * (room.clientHeight / rows);
            const div = document.createElement('div');
            div.className = "spot";
            div.style.left = x + "px";
            div.style.top = y + "px";
            room.appendChild(div);
            lampPositions.push({ x, y });
          }
        }
      }

      const leftMost = lampPositions.reduce((a,b)=>a.x<b.x?a:b);
      const topMost  = lampPositions.reduce((a,b)=>a.y<b.y?a:b);

      const wallToLampLeftM  = ((leftMost.x - SPOT_RADIUS) / SCALE).toFixed(2);
      const wallToLampTopM   = ((topMost.y - SPOT_RADIUS) / SCALE).toFixed(2);

      // الأسهم داخل المخطط
            drawArrowHorizontal(room, 0, leftMost.y, leftMost.x - SPOT_RADIUS, "right", wallToLampLeftM + " م");

      if (cols > 1) {
        const xMid1 = room.clientWidth / cols * 0.5;
        const xMid2 = room.clientWidth / cols * 1.5;
        const yMid  = room.clientHeight / 2;
        const betweenLampsM  = ((xMid2 - SPOT_RADIUS) - (xMid1 + SPOT_RADIUS)) / SCALE;
        drawArrowHorizontal(room, xMid1 + SPOT_RADIUS, yMid, xMid2 - SPOT_RADIUS, "right", betweenLampsM.toFixed(2) + " م");
      }

      drawArrowVertical(room, topMost.x, 0, topMost.y - SPOT_RADIUS, "down", wallToLampTopM + " م");

      if (rows > 1) {
        const yMid1 = room.clientHeight / rows * 0.5;
        const yMid2 = room.clientHeight / rows * 1.5;
        const xMid  = room.clientWidth / 2;
        const betweenRowsM  = ((yMid2 - SPOT_RADIUS) - (yMid1 + SPOT_RADIUS)) / SCALE;
        drawArrowVertical(room, xMid, yMid1 + SPOT_RADIUS, yMid2 - SPOT_RADIUS, "down", betweenRowsM.toFixed(2) + " م");
      }

      // كتابة الطول والعرض على المخطط
      const dimWidth = document.createElement('div');
      dimWidth.className = "dimension";
      dimWidth.style.top = (room.clientHeight + 6) + "px";
      dimWidth.style.left = (room.clientWidth/2 - 20) + "px";
      dimWidth.innerText = width + " م";
      room.appendChild(dimWidth);

      const dimLength = document.createElement('div');
      dimLength.className = "dimension";
      dimLength.style.left = (room.clientWidth + 6) + "px";
      dimLength.style.top = (room.clientHeight/2 - 10) + "px";
      dimLength.innerText = length + " م";
      room.appendChild(dimLength);

      // ملخص كسطور بدون نقاط
      document.getElementById('summary').innerHTML =
        `<div>
           <h3>🏠 أبعاد الغرفة</h3>
           <p>المساحة: ${area.toFixed(2)} م²</p>
           <p>الأبعاد: ${length} م × ${width} م</p>
         </div>
         <div>
           <h3>💡 الإضاءة</h3>
           <p>عدد النقاط: ${spots} سبوت</p>
           <p>المساحة النقطية: ${(area/spots).toFixed(2)} م² لكل سبوت</p>
           <p>نمط التوزيع: ${cols} أعمدة × ${rows} صفوف</p>
         </div>
         <div>
           <h3>📏 تفاصيل المسافات</h3>
           <p>من الجدران: ${wallToLampLeftM} م أفقياً، ${wallToLampTopM} م رأسياً</p>
           <p>بين الأعمدة: ${spacingX.toFixed(2)} م</p>
           <p>بين الصفوف: ${spacingY.toFixed(2)} م</p>
         </div>`;
    }

    // دوال الأسهم
    function drawArrowHorizontal(parent, x1, y, x2, dir="right", labelText="") {
      const lengthPx = Math.abs(x2 - x1);
      const startX = dir === "right" ? x1 : x2;

      const line = document.createElement('div');
      line.className = "arrow-line";
      line.style.left = startX + "px";
      line.style.top = (y - 1) + "px";
      line.style.width = lengthPx + "px";
      line.style.height = "2px";
      parent.appendChild(line);

      const head = document.createElement('div');
      head.className = "arrow-head " + (dir === "right" ? "head-right" : "head-left");
      head.style.left = (dir === "right" ? (startX + lengthPx) : (startX - 8)) + "px";
      head.style.top = (y - 6) + "px";
      parent.appendChild(head);

      if (labelText) {
        const label = document.createElement('div');
        label.className = "arrow-label";
        label.innerText = labelText;
        label.style.left = (startX + lengthPx/2) + "px";
        label.style.top = (y - 12) + "px";
        parent.appendChild(label);
      }
    }

    function drawArrowVertical(parent, x, y1, y2, dir="down", labelText="") {
      const lengthPx = Math.abs(y2 - y1);
      const startY = dir === "down" ? y1 : y2;

      const line = document.createElement('div');
      line.className = "arrow-line";
      line.style.left = (x - 1) + "px";
      line.style.top = startY + "px";
      line.style.width = "2px";
      line.style.height = lengthPx + "px";
      parent.appendChild(line);

      const head = document.createElement('div');
      head.className = "arrow-head " + (dir === "down" ? "head-down" : "head-up");
      head.style.left = (x - 8) + "px";
      head.style.top = (dir === "down" ? (startY + lengthPx) : (startY - 8)) + "px";
      parent.appendChild(head);

      if (labelText) {
        const label = document.createElement('div');
        label.className = "arrow-label";
        label.innerText = labelText;
        label.style.left = (x - 18) + "px";
        label.style.top = (startY + lengthPx/2) + "px";
        parent.appendChild(label);
      }
    }

    // حفظ المخطط مع الملخص كصورة
    function downloadPlan() {
      html2canvas(document.getElementById("planWrapper")).then(canvas => {
        const link = document.createElement("a");
        link.download = "spotlight-plan.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    }

    // مشاركة الخطة
    function sharePlan() {
      const summary = document.getElementById("summary").innerText;
      if (navigator.share) {
        navigator.share({
          title: "مخطط توزيع السبوت لايت",
          text: summary,
          url: window.location.href
        });
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert("تم نسخ رابط الخطة:\n" + window.location.href);
      }
    }

    // مسح وإعادة البدء
    function resetPlan() {
      document.getElementById('width').value = "";
      document.getElementById('length').value = "";
      document.getElementById('height').value = "";
      document.getElementById('roomType').selectedIndex = 0;
      document.getElementById('result').innerText = "";
      document.getElementById('room').innerHTML = "";
      document.getElementById('room').style.width = "0px";
      document.getElementById('room').style.height = "0px";
      document.getElementById('summary').innerHTML = "";
    }
  </script>

  <!-- مكتبة html2canvas لتحويل المخطط لصورة -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</body>
</html>
